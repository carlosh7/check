name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-latest
    env:
      # Entorno aislado para que database.js nunca toque datos reales ni haga exit()
      DATA_PATH: /tmp/check-ci-data
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production-use-000000000000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar entorno (bootstrap-env idempotente)
        run: node scripts/bootstrap-env.js

      - name: Suite de tests
        run: npm test -- --runInBand

      - name: Lint (baseline progresiva — bajar al limpiar código)
        run: npx eslint . --max-warnings=520  # v12.44.849: 503 avisos, 0 errores (umbral mantenido en 520); composición documentada en AUDIT_REPORT

  secrets:
    name: Detección de secretos filtrados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E batería de UI (Chrome)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Playwright (driver)
        run: npm i -D playwright --no-save
      # v12.44.849 (auditoría 2026-11-25, I5): el servidor se arrancaba en un step y la batería corría en
      # el siguiente; GitHub termina los procesos en segundo plano al acabar cada step, así que las
      # pruebas corrían sin servidor. Ahora servidor y batería viven en el mismo step.
      # JWT_SECRET de 46 caracteres: en producción el arranque aborta con secretos de menos de 32.
      - name: Arrancar servidor y batería E2E grupo A (core)
        env:
          DATA_PATH: /tmp/e2e-data
          JWT_SECRET: e2e-ci-secret-000000000000-000000000000-e2e-only
          ADMIN_EMAIL: ci-admin@check.local
          # v12.44.803: contraseña dinámica por run — CERO credenciales literales en el repo
          ADMIN_PASSWORD: ci-run-${{ github.run_id }}-Aa1
          NODE_ENV: production
          E2E_USER: ci-admin@check.local
          E2E_PASS: ci-run-${{ github.run_id }}-Aa1
        run: |
          node server.js > /tmp/check-e2e-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
          node scripts/test-all-features.js A
          RESULT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $RESULT
