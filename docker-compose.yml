version: '3.8'

services:
  check-app:
    build: .
    working_dir: /usr/src/app
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/usr/src/app/persistence
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3000}
      - DATA_PATH=${DATA_PATH:-/usr/src/app/persistence}
      - ALLOWED_ORIGINS=http://localhost:${PORT:-3000}
      - APP_URL=http://localhost:${PORT:-3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${PORT:-3000}/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - check-network

volumes:
  node_modules:

networks:
  check-network:
    driver: bridge
