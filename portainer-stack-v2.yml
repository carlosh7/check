# Stack v2 (v12.44.804) — Reemplaza a portainer-stack.yml una vez verificado.
#
# INSTRUCCIONES DE DESPLIEGUE EN PORTAINER:
# 1. ANTES de pegar este stack, crea la variable de entorno en el stack:
#    Portainer → Stacks → (nuevo/editar stack) → "Environment variables" →
#      GITHUB_PAT = <tu Personal Access Token>
#    Permisos del token: Contents (Read-only) para ambos repos:
#      - carlosh7/check
#      - carlosh7/check-3d-planner
# 2. El token NUNCA se escribe en este archivo: Compose sustituye ${GITHUB_PAT}
#    desde la variable del stack. Si falta, el clone fallará con mensaje claro.
# 3. Rotar el PAT anterior en GitHub si alguna vez se pegó literalmente.
#
# Cambios vs v1:
#   - Token por variable de entorno (antes: placeholder literal en el YAML).
#   - Node 22 (unificado con Dockerfile; antes node:20-slim).
#   - Sin chmod -R 777 en la persistencia (el contenedor corre como root y
#     escribe igual; 777 exponía los datos a cualquier usuario del host).

version: '3.8'

services:
  # ─── Check App (Express + SQLite) ───
  check-app:
    image: node:22-slim
    container_name: check-app
    restart: always
    ports:
      - '3000:3000'
    expose:
      - '3000'
    volumes:
      - /home/data_check:/usr/src/app/persistence
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_PATH=/usr/src/app/persistence
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy-network
    entrypoint: []
    command: >
      sh -c "
      echo '=== check-app deploy (v2) ===' &&
      if [ -z \"$$GITHUB_PAT\" ]; then echo '❌ GITHUB_PAT no definida: configúrala en las variables de entorno del stack en Portainer' && exit 1; fi &&
      apt-get update && apt-get install -y git rsync ca-certificates &&
      mkdir -p /usr/src/app/persistence/system /usr/src/app/persistence/events /usr/src/app/persistence/uploads &&
      rm -rf /tmp/app_new &&
      git clone --depth 1 https://x-access-token:$${GITHUB_PAT}@github.com/carlosh7/check.git /tmp/app_new &&
      rsync -av /tmp/app_new/. /usr/src/app/ &&
      rm -rf /tmp/app_new &&
      cd /usr/src/app &&
      npm install --omit=dev &&
      npm start"

  # ─── Check 3D Planner (React + Three.js + nginx) ───
  check-3d-planner:
    image: node:22-slim
    container_name: check-3d-planner
    restart: always
    ports:
      - '3001:3001'
    expose:
      - '3001'
    networks:
      - proxy-network
    entrypoint: []
    command: >
      sh -c "
      echo '=== check-3d-planner deploy (v2) ===' &&
      if [ -z \"$$GITHUB_PAT\" ]; then echo '❌ GITHUB_PAT no definida: configúrala en las variables de entorno del stack en Portainer' && exit 1; fi &&
      apt-get update -qq &&
      apt-get install -y -qq --no-install-recommends git rsync nginx curl ca-certificates &&
      rm -rf /var/lib/apt/lists/* &&
      rm -rf /tmp/app_new &&
      git clone --depth 1 https://x-access-token:$${GITHUB_PAT}@github.com/carlosh7/check-3d-planner.git /tmp/app_new &&
      rsync -av /tmp/app_new/. /app/ &&
      rm -rf /tmp/app_new &&
      cd /app &&
      npm ci &&
      npm run build &&
      echo '=== Build complete, starting nginx ===' &&
      mkdir -p /usr/share/nginx/html &&
      cp -r dist/* /usr/share/nginx/html/ &&
      cp nginx.conf /etc/nginx/conf.d/default.conf 2>/dev/null || true &&
      nginx -g 'daemon off;'
      "

networks:
  proxy-network:
    name: proxy-network
    driver: bridge
