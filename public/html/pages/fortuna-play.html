<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta de la Fortuna | Check Pro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pages/fortuna-play.css?v=12.44.836">
</head>
<body>
<div id="loading"><div><div class="sp"></div><p>Cargando promoción...</p></div></div>
<div id="error" data-style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#0f172a;z-index:99999;flex-direction:column;text-align:center;padding:32px">
  <h2 data-style="font-size:20px;margin-bottom:8px;color:#fff">Promoción no disponible</h2>
  <p id="errmsg" data-style="font-size:14px;color:#94a3b8;margin-bottom:24px"></p>
  <button data-act="call" data-call="reloadPage" data-style="padding:10px 28px;border:none;border-radius:10px;background:#ec4899;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Reintentar</button>
</div>

<div id="app" class="fzp hidden">
  <h1 id="g-title" class="fzp-title">¡Gira la ruleta y gana!</h1>
  <p id="g-desc" class="fzp-desc"></p>

  <!-- PANTALLA: FORMULARIO -->
  <div id="scr-form" class="fzp-screen">
    <div class="fzp-form">
      <input id="f-email" type="email" class="fzp-input" placeholder="Correo Electrónico" autocomplete="email">
      <input id="f-name" type="text" class="fzp-input fzp-extra" placeholder="Nombre" data-style="display:none">
      <input id="f-apellido" type="text" class="fzp-input fzp-extra" placeholder="Apellido" data-style="display:none">
      <input id="f-phone" type="tel" class="fzp-input fzp-extra" placeholder="Teléfono" data-style="display:none">
      <label id="f-consent-row" class="fzp-consent" data-style="display:none"><input type="checkbox" id="f-consent"><span id="f-consent-text"></span></label>
      <button id="btn-play" class="fzp-btn" data-act="call" data-call="play">Probar Suerte</button>
      <p id="form-err" class="fzp-err"></p>
    </div>
    <div class="fzp-wheel-ct">
      <div class="fzp-pointer"><svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M12 2 L20 10 L15 10 L15 22 L9 22 L9 10 L4 10 Z" transform="rotate(180 12 12)"/></svg></div>
      <canvas id="wcanvas" width="420" height="420"></canvas>
    </div>
  </div>

  <!-- PANTALLA: GIRANDO -->
  <div id="scr-spinning" class="fzp-screen hidden">
    <div class="fzp-wheel-ct fzp-spinning">
      <div class="fzp-pointer"><svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M12 2 L20 10 L15 10 L15 22 L9 22 L9 10 L4 10 Z" transform="rotate(180 12 12)"/></svg></div>
      <canvas id="wcanvas2" width="420" height="420"></canvas>
    </div>
    <p class="fzp-wait">Girando...</p>
  </div>

  <!-- PANTALLA: RESULTADO -->
  <div id="scr-result" class="fzp-screen hidden">
    <div class="fzp-result" id="res-box">
      <span id="res-emoji" class="fzp-emoji">🎉</span>
      <h2 id="res-title" class="fzp-restitle"></h2>
      <p id="res-desc" class="fzp-resdesc"></p>
      <div id="res-prize-box" class="fzp-prizebox hidden">
        <span class="fzp-prize-label">🎁 Tu premio</span>
        <span id="res-prize" class="fzp-prize"></span>
        <span id="res-value" class="fzp-value"></span>
      </div>
      <button id="btn-cert" class="fzp-btn fzp-btn--soft" data-act="call" data-call="downloadCert" data-style="display:none">📄 Descargar comprobante</button>
      <button id="btn-again" class="fzp-btn fzp-btn--soft" data-act="call" data-call="playAgain" data-style="display:none">🔄 Jugar de nuevo</button>
      <div id="res-share" class="fzp-share hidden">
        <a id="sh-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a id="sh-fb" target="_blank" rel="noopener">Facebook</a>
        <a id="sh-x" target="_blank" rel="noopener">X</a>
      </div>
    </div>
  </div>

  <div class="fzp-watermark">Powered by Check Pro</div>
</div>

<div id="toast" class="fzp-toast"></div>
<canvas id="jsccc" class="fzp-confetti"></canvas>

<script type="module" src="/js/modules/core/DelegatedEvents.js?v=12.44.836"></script>
<script src="/js/pages/fortuna-play.js?v=12.44.836"></script>
</body>
</html>
