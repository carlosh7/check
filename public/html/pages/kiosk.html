<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kiosko | Check Pro</title>
<link rel="stylesheet" href="/css/pages/kiosk-page.css?v=12.44.811">
</head>
<body role="document" aria-label="Kiosko de check-in">
<div id="app">
  <div class="logo">
    <h1>Check Pro</h1>
    <p id="event-name">Cargando evento...</p>
  </div>

  <div class="stats" id="stats-bar">
    <div class="stats-item"><span class="num" id="stat-total">0</span><span class="lbl">Invitados</span></div>
    <div class="stats-item"><span class="num" id="stat-checked">0</span><span class="lbl">Ingresaron</span></div>
  </div>

  <div id="main-screen">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Busca tu nombre o email..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div id="error-msg" class="error-msg"></div>

    <div class="qr-section">
      <button class="qr-btn" id="qr-btn" data-act="call" data-call="toggleQR">
        <span class="icon">📷</span> Escanear código QR
      </button>
    </div>
    <div id="reader"></div>

    <div id="results" class="results"></div>
  </div>

  <div id="confirm-screen" class="confirm-screen">
    <div class="icon">👤</div>
    <div class="name" id="confirm-name"></div>
    <div class="detail" id="confirm-detail"></div>
    <button class="checkin-btn" data-act="call" data-call="confirmCheckin">✅ Confirmar ingreso</button>
    <button class="cancel-btn" data-act="call" data-call="cancelCheckin">No soy yo, volver</button>
  </div>

  <div id="success-screen" class="success-screen">
    <span class="icon">✅</span>
    <div class="name" id="success-name">¡Bienvenido!</div>
    <div class="detail">Tu ingreso ha sido registrado</div>
    <div class="timer" id="reset-timer-display">5</div>
  </div>

  <div id="already-screen" class="already-screen">
    <div class="icon">ℹ️</div>
    <div class="name">Ya registraste tu ingreso</div>
    <div class="detail" id="already-detail"></div>
    <div class="timer" id="already-timer-display" data-style="font-size:40px;font-weight:700;color:#a78bfa;margin-top:16px">5</div>
  </div>

  <div id="reset-timer" data-act="call" data-call="resetKiosk">↩ Volver al inicio</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"></script>
<script type="module" src="/js/modules/core/DelegatedEvents.js?v=12.44.811"></script>
  <script src="/js/pages/kiosk.js?v=12.44.811"></script>
</body>
</html>
