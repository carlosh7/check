<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boleto Digital | Check Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <link rel="stylesheet" href="/css/modules/base.css?v=12.44.811">
    <link rel="stylesheet" href="/css/modules/components.css?v=12.44.811">
    <link rel="stylesheet" href="/css/modules/ticket.css?v=12.44.811">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script type="module" src="/js/modules/core/DelegatedEvents.js?v=12.44.811"></script>
  <script src="/js/pages/ticket.js?v=12.44.811"></script>
    <link rel="stylesheet" href="/css/pages/ticket-page.css?v=12.44.811">
</head>
<body class="ticket-body ticket-bg-pattern">
    <div id="loading" class="ticket-loading">
        <div class="ticket-loading-inner">
            <div class="ticket-loading-icon">
                <span class="material-symbols-outlined">shield_checked</span>
            </div>
            <p class="ticket-loading-text">Cargando...</p>
        </div>
    </div>

    <div id="main-content" class="ticket-main hidden">
        <div id="ticket-container" class="ticket-card">
            <div id="ticket-header-bg" class="ticket-header">
                <div id="ticket-logo" class="ticket-logo">
                    <img src="" alt="Logo">
                </div>
                <h2 id="ticket-event-name" class="ticket-title">Registro de Invitados</h2>
                <h3 id="ticket-guest-name" class="ticket-event-name"></h3>
                <div class="ticket-location">
                    <span class="material-symbols-outlined">location_on</span>
                    <span id="ticket-location"></span>
                </div>
                <p id="ticket-description" class="ticket-description hidden"></p>
            </div>
            
            <div class="ticket-countdown">
                <div id="countdown-timer" class="ticket-countdown-timer">00:00:00</div>
                <p class="ticket-countdown-label">Para el evento</p>
            </div>

            <div class="ticket-body-content">
                <div class="ticket-qr-container">
                    <canvas id="ticket-qr-canvas"></canvas>
                </div>

                <div class="ticket-info">
                    <div class="ticket-info-row">
                        <span class="ticket-info-label">Fecha</span>
                        <span id="ticket-date" class="ticket-info-value"></span>
                    </div>
                    <div class="ticket-info-row">
                        <span class="ticket-info-label">Ubicación</span>
                        <span id="ticket-location-detail" class="ticket-info-value"></span>
                    </div>
                    <div class="ticket-info-row">
                        <span class="ticket-info-label">ID</span>
                        <span id="ticket-guest-id" class="ticket-id"></span>
                    </div>
                </div>

                <div class="ticket-actions">
                    <button id="btn-download" class="ticket-btn ticket-btn-download">
                        <span class="material-symbols-outlined">download</span>
                        Descargar
                    </button>
                    <button id="btn-share" class="ticket-btn ticket-btn-share">
                        <span class="material-symbols-outlined">share</span>
                        Compartir
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
